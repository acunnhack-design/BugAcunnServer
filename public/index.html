<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BUG ACUNN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron',sans-serif; }
        body { background:#0a0a0f; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .container {
            max-width:420px; width:100%; background:rgba(20,20,30,0.9); backdrop-filter:blur(20px);
            border-radius:40px; padding:30px 25px;
            box-shadow:0 20px 60px rgba(0,255,100,0.15), inset 0 0 0 1px rgba(0,255,100,0.2);
            border:1px solid rgba(0,255,100,0.3);
            animation:fadeIn 0.8s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
        .logo-section { text-align:center; margin-bottom:25px; }
        .logo-icon {
            font-size:48px; color:#00ff88; text-shadow:0 0 30px #00ff8866;
            animation:pulse 2s infinite;
        }
        @keyframes pulse { 0% { text-shadow:0 0 10px #00ff88; } 50% { text-shadow:0 0 40px #00ff88,0 0 80px #00ff8866; } 100% { text-shadow:0 0 10px #00ff88; } }
        .logo-title {
            font-size:32px; font-weight:900; background:linear-gradient(135deg,#00ff88,#00ccff);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:2px; margin-top:5px;
        }
        .logo-sub { color:#aaa; font-size:12px; letter-spacing:4px; border-top:1px solid #333; padding-top:8px; display:inline-block; }
        .tagline {
            color:#66ffaa; text-align:center; font-size:14px; letter-spacing:3px;
            margin-bottom:25px; background:rgba(0,255,100,0.05); padding:8px; border-radius:50px;
            border:1px solid rgba(0,255,100,0.2);
            animation:glow 3s infinite alternate;
        }
        @keyframes glow { from { box-shadow:0 0 10px rgba(0,255,136,0.1); } to { box-shadow:0 0 25px rgba(0,255,136,0.4); } }
        .features-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:30px; }
        .feature-card {
            background:rgba(255,255,255,0.03); border-radius:20px; padding:16px 10px; text-align:center;
            border:1px solid rgba(255,255,255,0.06); transition:0.3s;
        }
        .feature-card:hover { transform:translateY(-3px); box-shadow:0 0 20px rgba(0,255,136,0.1); }
        .feature-card i { font-size:28px; color:#00ff88; margin-bottom:6px; display:block; }
        .feature-card h4 { color:#eee; font-size:14px; font-weight:700; letter-spacing:1px; }
        .feature-card p { color:#888; font-size:10px; font-weight:400; margin-top:2px; }
        .btn-primary {
            width:100%; padding:16px; background:linear-gradient(135deg,#00ff88,#00cc88); border:none;
            border-radius:30px; color:#0a0a0f; font-weight:900; font-size:18px; letter-spacing:2px;
            cursor:pointer; transition:0.2s; box-shadow:0 0 30px rgba(0,255,136,0.3); margin-bottom:12px;
        }
        .btn-primary:active { transform:scale(0.97); box-shadow:0 0 60px rgba(0,255,136,0.5); }
        .btn-secondary {
            width:100%; padding:14px; background:rgba(255,255,255,0.05); border:1px solid #444;
            border-radius:30px; color:#ccc; font-weight:700; font-size:14px; letter-spacing:1px;
            cursor:pointer; transition:0.2s; text-align:center; margin-bottom:10px;
        }
        .btn-secondary:active { background:rgba(255,255,255,0.1); }
        .contact-links { display:flex; justify-content:center; gap:20px; margin-top:20px; border-top:1px solid #222; padding-top:20px; }
        .contact-links a { color:#aaa; text-decoration:none; font-size:14px; font-weight:400; letter-spacing:1px; transition:0.2s; }
        .contact-links a i { margin-right:6px; color:#00ff88; }
        .login-form { display:none; margin-top:10px; }
        .login-form.active { display:block; }
        .login-form input {
            width:100%; padding:16px 20px; margin-bottom:15px; background:rgba(255,255,255,0.05);
            border:1px solid #333; border-radius:30px; color:#fff; font-size:14px; outline:none; transition:0.2s;
        }
        .login-form input:focus { border-color:#00ff88; box-shadow:0 0 20px rgba(0,255,136,0.1); }
        .login-form input::placeholder { color:#666; }
        .login-status { text-align:center; color:#ff4466; font-size:12px; margin-top:8px; display:none; }
        .login-status.error { display:block; animation:shake 0.5s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
        .dashboard { display:none; }
        .dashboard.active { display:block; animation:fadeIn 0.6s ease; }
        .target-list {
            background:rgba(255,255,255,0.03); border-radius:20px; padding:15px; max-height:200px;
            overflow-y:auto; margin:15px 0; border:1px solid #222;
        }
        .target-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #1a1a1a; color:#ccc; font-size:12px; }
        .target-item .role { font-weight:700; color:#00ff88; }
        .target-item .remove { color:#ff4466; cursor:pointer; }
        .add-target { display:flex; gap:10px; margin:15px 0; }
        .add-target input { flex:1; padding:12px 16px; background:rgba(255,255,255,0.05); border:1px solid #333; border-radius:30px; color:#fff; font-size:12px; outline:none; }
        .add-target input:focus { border-color:#00ff88; }
        .add-target select { padding:12px 16px; background:#1a1a1a; border:1px solid #333; border-radius:30px; color:#fff; font-size:12px; outline:none; }
        .add-target button { padding:12px 20px; background:#00ff88; border:none; border-radius:30px; color:#0a0a0f; font-weight:900; font-size:14px; cursor:pointer; }
        .stats {
            display:flex; justify-content:space-between; background:rgba(0,255,136,0.05); padding:12px 20px;
            border-radius:30px; border:1px solid rgba(0,255,136,0.2); margin:15px 0; color:#aaa; font-size:12px;
        }
        .stats span { color:#00ff88; font-weight:700; }
        .logout-btn { background:none; border:none; color:#ff4466; font-size:12px; text-decoration:underline; cursor:pointer; margin-top:10px; }
        .pairing-section { margin:15px 0; display:flex; gap:8px; flex-wrap:wrap; }
        .pairing-section input { flex:2; padding:12px 16px; background:rgba(255,255,255,0.05); border:1px solid #333; border-radius:30px; color:#fff; font-size:12px; outline:none; min-width:120px; }
        .pairing-section button { padding:12px 20px; background:#4466ff; border:none; border-radius:30px; color:#fff; font-weight:bold; cursor:pointer; flex:1; }
        .attack-selector { display:flex; gap:10px; margin:10px 0; align-items:center; flex-wrap:wrap; }
        .attack-selector select { flex:2; padding:12px; background:#1a1a1a; border:1px solid #333; border-radius:30px; color:#fff; font-size:12px; outline:none; min-width:150px; }
        .attack-selector button { flex:1; padding:12px; background:#ff8800; border:none; border-radius:30px; color:#000; font-weight:bold; cursor:pointer; }
        .admin-panel { margin-top:20px; border-top:1px solid #333; padding-top:15px; display:none; }
        .admin-panel.active { display:block; }
        .admin-panel h3 { color:#ffaa00; font-size:16px; margin-bottom:10px; }
        .admin-panel .user-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #222; color:#aaa; font-size:12px; }
        .admin-panel .user-item span { color:#fff; }
        .qr-display { background:#111; padding:15px; border-radius:20px; margin:10px 0; color:#0f0; font-size:12px; word-break:break-all; border:1px solid #00ff8855; max-height:150px; overflow:auto; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:#111; }
        ::-webkit-scrollbar-thumb { background:#00ff88; border-radius:10px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="logo-section">
        <i class="fas fa-skull logo-icon"></i>
        <div class="logo-title">BUG ACUNN</div>
        <div class="logo-sub">DARK SPECTRA v12.0</div>
    </div>
    <div class="tagline"><i class="fas fa-bolt" style="margin-right:6px;"></i> Advanced Weapon System <i class="fas fa-bolt" style="margin-left:6px;"></i></div>

    <div class="features-grid">
        <div class="feature-card"><i class="fas fa-shield-alt"></i><h4>SECURE</h4><p>Encrypted</p></div>
        <div class="feature-card"><i class="fas fa-bolt"></i><h4>FAST</h4><p>Response</p></div>
        <div class="feature-card"><i class="fas fa-check-circle"></i><h4>TRUSTED</h4><p>Reliable</p></div>
        <div class="feature-card"><i class="fas fa-headset"></i><h4>24/7</h4><p>Support</p></div>
    </div>

    <div id="landingButtons">
        <button class="btn-primary" id="showLoginBtn"><i class="fas fa-sign-in-alt"></i>  SIGN IN</button>
        <button class="btn-secondary" id="buyAccessBtn"><i class="fas fa-crown"></i>  BUY ACCESS</button>
        <div class="contact-links">
            <a href="#" id="contactTelegram"><i class="fab fa-telegram-plane"></i> Telegram</a>
            <a href="#" id="contactWhatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div>
    </div>

    <div class="login-form" id="loginForm">
        <h3 style="color:#eee; font-size:18px; text-align:center; margin-bottom:15px; letter-spacing:1px;">
            <i class="fas fa-user-secret" style="color:#00ff88;"></i> Welcome Back
        </h3>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button class="btn-primary" id="loginBtn"><i class="fas fa-arrow-right"></i>  SIGN IN</button>
        <div class="login-status" id="loginStatus">❌ Username atau password salah</div>
        <button class="btn-secondary" id="backToLanding" style="margin-top:8px;"><i class="fas fa-arrow-left"></i>  Kembali</button>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="stats">
            <span><i class="fas fa-bullseye"></i> Target: <span id="totalTargets">0</span></span>
            <span><i class="fas fa-paper-plane"></i> Spam: <span id="totalSpam">0</span></span>
            <span><i class="fas fa-circle" style="color:#00ff88;"></i> <span id="connectionStatus">Offline</span></span>
        </div>

        <div class="pairing-section">
            <input type="text" id="pairPhone" placeholder="628xxx (pairing code)">
            <button id="pairBtn"><i class="fas fa-link"></i> Pairing</button>
            <button id="qrBtn" style="background:#00aa88;"><i class="fas fa-qrcode"></i> QR</button>
        </div>
        <div id="qrDisplay" class="qr-display" style="display:none;"></div>

        <div class="attack-selector">
            <select id="attackType">
                <option value="crash_ui">💥 CRASH UI (by @PANCYOFFICIAL)</option>
                <option value="delay_invisible">🌀 DELAY INVISIBLE</option>
                <option value="crash_ios_invisible">🍎 CRASH IOS INVISIBLE</option>
                <option value="force_close_1msg">💀 FORCE CLOSE INFINITY 1 MSG</option>
                <option value="force_close_invisible">👻 FORCE CLOSE INVISIBLE</option>
                <option value="force_close_ios_invisible">🍏 FORCE CLOSE IOS INVISIBLE</option>
                <option value="spam_call">📞 SPAM CALL</option>
                <option value="delay_hard_invisible">⏳ DELAY HARD INVISIBLE</option>
                <option value="blank_andro">📱 BLANK ANDRO</option>
                <option value="force_close_infinity">♾️ FORCE CLOSE INFINITY</option>
                <option value="video_exploit">🎬 VIDEO EXPLOIT</option>
                <option value="cyclone" selected>🌀 CYCLONE (ALL-IN-ONE)</option>
            </select>
            <button id="setAttackBtn">Set</button>
        </div>

        <div class="add-target">
            <input type="text" id="newTarget" placeholder="628xxx (nomor target)">
            <select id="roleSelect"><option value="admin">👑 Admin</option><option value="users">👤 User</option></select>
            <button id="addTargetBtn"><i class="fas fa-plus"></i></button>
        </div>
        <div class="target-list" id="targetList"></div>
        <div style="display:flex; gap:10px;">
            <button class="btn-primary" id="startSpamBtn" style="flex:1; font-size:14px; padding:12px;">
                <i class="fas fa-play"></i> START
            </button>
            <button class="btn-secondary" id="stopSpamBtn" style="flex:1; font-size:14px; padding:12px; border-color:#ff4466; color:#ff4466;">
                <i class="fas fa-stop"></i> STOP
            </button>
        </div>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>

        <div class="admin-panel" id="adminPanel">
            <h3><i class="fas fa-user-cog"></i> Admin Panel</h3>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <input type="text" id="newUser" placeholder="Username" style="flex:1; padding:8px 12px; background:rgba(255,255,255,0.05); border:1px solid #333; border-radius:20px; color:#fff; font-size:12px; outline:none;">
                <input type="password" id="newPass" placeholder="Password" style="flex:1; padding:8px 12px; background:rgba(255,255,255,0.05); border:1px solid #333; border-radius:20px; color:#fff; font-size:12px; outline:none;">
                <button id="addUserBtn" style="padding:8px 16px; background:#00ff88; border:none; border-radius:20px; color:#000; font-weight:bold;">+</button>
            </div>
            <div id="userList" style="max-height:150px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<script>
let token = null, username = null;
let userData = { targets: { admin: [], users: [] }, totalSpam: 0, connected: false };

const landing = document.getElementById('landingButtons');
const loginForm = document.getElementById('loginForm');
const dashboard = document.getElementById('dashboard');
const loginStatus = document.getElementById('loginStatus');
const targetList = document.getElementById('targetList');
const totalTargets = document.getElementById('totalTargets');
const totalSpam = document.getElementById('totalSpam');
const connectionStatus = document.getElementById('connectionStatus');
const adminPanel = document.getElementById('adminPanel');
const qrDisplay = document.getElementById('qrDisplay');

async function apiCall(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['x-token'] = token;
    const res = await fetch(endpoint, { ...options, headers });
    return res.json();
}

function renderTargets() {
    const admin = userData.targets.admin || [];
    const users = userData.targets.users || [];
    let html = '';
    admin.forEach(num => {
        html += `<div class="target-item"><span class="role">👑 Admin</span> ${num} <span class="remove" data-num="${num}" data-role="admin">✖</span></div>`;
    });
    users.forEach(num => {
        html += `<div class="target-item"><span class="role">👤 User</span> ${num} <span class="remove" data-num="${num}" data-role="users">✖</span></div>`;
    });
    targetList.innerHTML = html || '<div style="color:#666;text-align:center;padding:20px;">Belum ada target</div>';
    totalTargets.textContent = admin.length + users.length;
    document.querySelectorAll('.remove').forEach(el => {
        el.addEventListener('click', async function() {
            const num = this.dataset.num, role = this.dataset.role;
            await apiCall('/api/targets', { method: 'DELETE', body: JSON.stringify({ number: num, role }) });
            fetchStatus();
        });
    });
}

async function fetchStatus() {
    if (!token) return;
    try {
        const data = await apiCall('/api/status');
        if (data.error) { alert('Session expired, login ulang.'); logout(); return; }
        userData.targets = data.targets || { admin: [], users: [] };
        userData.totalSpam = data.totalSpam || 0;
        userData.connected = data.connected || false;
        totalSpam.textContent = userData.totalSpam;
        connectionStatus.textContent = userData.connected ? 'Online' : 'Offline';
        connectionStatus.style.color = userData.connected ? '#00ff88' : '#ff4466';
        if (data.attackType) document.getElementById('attackType').value = data.attackType;
        renderTargets();
        if (username === 'admin') fetchUsers();
    } catch(e) { console.log(e); }
}

async function fetchUsers() {
    if (username !== 'admin') return;
    try {
        const data = await apiCall('/api/admin/users');
        if (data.error) return;
        const list = document.getElementById('userList');
        list.innerHTML = data.map(u => 
            `<div class="user-item"><span>${u.username}</span> <span>Spam: ${u.totalSpam} | Target: ${u.targetCount} | ${u.connected?'🟢':'🔴'}</span></div>`
        ).join('');
    } catch(e) {}
}

async function login() {
    const uname = document.getElementById('loginUsername').value.trim();
    const pass = document.getElementById('loginPassword').value.trim();
    if (!uname || !pass) {
        loginStatus.textContent = '❌ Isi username dan password!';
        loginStatus.classList.add('error');
        return;
    }
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type':'application/json' },
            body: JSON.stringify({ username: uname, password: pass })
        });
        const data = await res.json();
        if (data.error) {
            loginStatus.textContent = '❌ ' + data.error;
            loginStatus.classList.add('error');
            return;
        }
        token = data.token;
        username = data.username;
        landing.style.display = 'none';
        loginForm.classList.remove('active');
        dashboard.classList.add('active');
        if (username === 'admin') adminPanel.classList.add('active');
        await apiCall('/api/start', { method: 'POST' });
        fetchStatus();
        setInterval(fetchStatus, 5000);
        localStorage.setItem('bugacunn_token', token);
        localStorage.setItem('bugacunn_user', username);
    } catch(e) {
        loginStatus.textContent = '❌ Gagal login, coba lagi.';
        loginStatus.classList.add('error');
    }
}

function logout() {
    token = null; username = null;
    dashboard.classList.remove('active');
    adminPanel.classList.remove('active');
    landing.style.display = 'block';
    loginForm.classList.remove('active');
    localStorage.removeItem('bugacunn_token');
    localStorage.removeItem('bugacunn_user');
}

document.getElementById('pairBtn').addEventListener('click', async () => {
    const phone = document.getElementById('pairPhone').value.trim();
    if (!phone || phone.length < 10) { alert('Masukkan nomor dengan benar!'); return; }
    try {
        const res = await apiCall('/api/pair', { method: 'POST', body: JSON.stringify({ phone }) });
        if (res.code) {
            alert('Kode pairing: ' + res.code + '\nMasukkan di WhatsApp target.');
        } else if (res.error) {
            alert('Error: ' + res.error);
        }
    } catch(e) { alert('Gagal pairing: ' + e.message); }
});

document.getElementById('qrBtn').addEventListener('click', async () => {
    try {
        const res = await apiCall('/api/qr');
        if (res.qr) {
            qrDisplay.style.display = 'block';
            qrDisplay.textContent = res.qr;
        } else {
            alert('Tidak ada QR aktif. Coba START dulu.');
        }
    } catch(e) {
        alert('Gagal ambil QR: ' + e.message);
    }
});

document.getElementById('setAttackBtn').addEventListener('click', async () => {
    const type = document.getElementById('attackType').value;
    await apiCall('/api/setattack', { method: 'POST', body: JSON.stringify({ type }) });
    alert('Serangan diubah ke ' + type);
});

document.getElementById('addTargetBtn').addEventListener('click', async () => {
    const num = document.getElementById('newTarget').value.trim();
    const role = document.getElementById('roleSelect').value;
    if (!num || num.length < 10) {
        alert('Nomor minimal 10 digit, goblok!');
        return;
    }
    await apiCall('/api/targets', {
        method: 'POST',
        body: JSON.stringify({ number: num, role })
    });
    document.getElementById('newTarget').value = '';
    fetchStatus();
});

document.getElementById('startSpamBtn').addEventListener('click', async () => {
    await apiCall('/api/start', { method: 'POST' });
    fetchStatus();
});

document.getElementById('stopSpamBtn').addEventListener('click', async () => {
    await apiCall('/api/stop', { method: 'POST' });
    fetchStatus();
});

// Login UI
document.getElementById('showLoginBtn').addEventListener('click', () => {
    landing.style.display = 'none';
    loginForm.classList.add('active');
});

document.getElementById('backToLanding').addEventListener('click', () => {
    loginForm.classList.remove('active');
    landing.style.display = 'block';
});

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('loginPassword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
});
document.getElementById('loginUsername').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
});

document.getElementById('logoutBtn').addEventListener('click', logout);

// Contact
document.getElementById('contactTelegram').addEventListener('click', (e) => {
    e.preventDefault();
    window.open('https://t.me/Acunn', '_blank');
});
document.getElementById('contactWhatsapp').addEventListener('click', (e) => {
    e.preventDefault();
    window.open('https://wa.me/6281234567890', '_blank');
});
document.getElementById('buyAccessBtn').addEventListener('click', () => {
    alert('Hubungi @Acunn di Telegram untuk beli akses!');
});

// Admin: tambah user
document.getElementById('addUserBtn').addEventListener('click', async () => {
    const uname = document.getElementById('newUser').value.trim();
    const pass = document.getElementById('newPass').value.trim();
    if (!uname || !pass) {
        alert('Isi username dan password!');
        return;
    }
    const res = await apiCall('/api/admin/adduser', {
        method: 'POST',
        body: JSON.stringify({ username: uname, password: pass })
    });
    if (res.success) {
        alert('User ditambahkan!');
        document.getElementById('newUser').value = '';
        document.getElementById('newPass').value = '';
        fetchUsers();
    } else {
        alert('Gagal: ' + (res.error || 'unknown'));
    }
});

// Auto-login dari localStorage
const savedToken = localStorage.getItem('bugacunn_token');
const savedUser = localStorage.getItem('bugacunn_user');
if (savedToken && savedUser) {
    token = savedToken;
    username = savedUser;
    landing.style.display = 'none';
    dashboard.classList.add('active');
    if (username === 'admin') adminPanel.classList.add('active');
    fetchStatus();
    setInterval(fetchStatus, 5000);
}
</script>
</body>
</html>
